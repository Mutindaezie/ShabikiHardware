<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ShabikiHardware</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f3;--sf:#fff;--ink:#1b2830;--mu:#5d6c74;--ln:#d5dcde;--side:#1b2830;--ac:#f2b705;--ok:#2c7a4b;--bad:#b3362b;--bl:#2f6f8f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11191e;--sf:#1a252c;--ink:#e8eef0;--mu:#93a3ab;--ln:#2d3b44;--side:#0b1115;--ok:#4cb87a;--bad:#e5695d;--bl:#6fb2d2}}
:root[data-theme="dark"]{--bg:#11191e;--sf:#1a252c;--ink:#e8eef0;--mu:#93a3ab;--ln:#2d3b44;--side:#0b1115;--ok:#4cb87a;--bad:#e5695d;--bl:#6fb2d2}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Barlow,system-ui,sans-serif;display:flex;min-height:100vh}
h1,h2,h3{font-family:'Barlow Condensed',Impact,sans-serif;margin:0;letter-spacing:.2px}
nav{width:210px;background:var(--side);color:#e8eef0;padding:18px 12px;flex:none;position:sticky;top:0;height:100vh}
.logo{font:700 26px 'Barlow Condensed',Impact,sans-serif;line-height:1;padding:4px 8px 18px}.logo b{color:var(--ac)}.logo small{display:block;font:400 12px Barlow,sans-serif;color:#93a3ab;margin-top:4px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#c5d0d5;padding:10px 12px;border-radius:6px;font:500 15px Barlow,sans-serif;cursor:pointer;border-left:3px solid transparent}
nav button.on{background:#27363f;color:#fff;border-left-color:var(--ac)}nav button:hover{background:#223039}
main{flex:1;padding:22px;min-width:0;max-width:1200px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}h2{font-size:30px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:12px 14px;border-top:3px solid var(--ln)}.k span{color:var(--mu);font-size:13px}.k b{display:block;font:700 26px 'Barlow Condensed',Impact,sans-serif}
.k.g{border-top-color:var(--ok)}.k.r{border-top-color:var(--bad)}.k.y{border-top-color:var(--ac)}.k.b{border-top-color:var(--bl)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:16px}.card h3{font-size:20px;margin-bottom:8px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.g2>.card{margin:0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:13px}td.n,th.n{text-align:right}
button.b1,button.b2,button.sm{font:600 14px Barlow,sans-serif;border-radius:6px;cursor:pointer;padding:8px 14px;border:1px solid var(--ink)}
.b1{background:var(--ac);color:#1b2830;border-color:#c99700!important}.b2{background:var(--sf);color:var(--ink)}.sm{background:var(--sf);color:var(--ink);padding:3px 9px!important;font-size:13px!important;margin-right:4px;border-color:var(--ln)!important}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}.t-ok{background:#2c7a4b26;color:var(--ok)}.t-bad{background:#b3362b26;color:var(--bad)}.t-w{background:#f2b70530;color:#9a7300}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}.bar i{display:block;height:10px;border-radius:2px}.bar em{font-style:normal;color:var(--mu)}
.cols{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:6px}.cols div{flex:1;text-align:center;font-size:11px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.cols i{display:block;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px;z-index:9}#modal[hidden]{display:none}
.box{background:var(--sf);border-radius:10px;padding:18px;width:100%;max-width:560px}.box h3{font-size:24px;margin-bottom:10px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.fg label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:3px}
input,select{font:15px Barlow,sans-serif;padding:8px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.mu{color:var(--mu)}.pos{color:var(--ok)}.neg{color:var(--bad)}
.doc{background:#fff;color:#111;padding:24px;border-radius:6px;margin-bottom:12px}.doc table{color:#111}.doc th,.doc td{border-color:#ccc}.doc h3{font-size:30px}
@media(max-width:800px){body{flex-direction:column}nav{width:100%;height:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;overflow-x:auto;padding:8px;gap:2px}.logo{display:none}nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent}nav button.on{border-bottom-color:var(--ac)}main{padding:14px}.fg{grid-template-columns:1fr}}
@media print{body *{visibility:hidden}.doc,.doc *{visibility:visible}.doc{position:absolute;left:0;top:0;width:100%}}
.lg{max-width:380px;margin:8vh auto 0}.lg label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}.lg .b1{width:100%}.err{color:var(--bad);min-height:22px;font-size:13px;margin:6px 0}.me{margin-top:18px;padding:10px;border-top:1px solid #2d3b44;font-size:13px;color:#93a3ab}.me b{display:block;color:#fff}nav .me button{width:auto;border:1px solid #3b4d57;padding:4px 10px;margin-top:6px;text-align:center}.rl p{margin:4px 0}
@media(max-width:800px){.me{margin:0 0 0 auto;border:0;padding:0 6px;white-space:nowrap}.lg{margin-top:3vh}}
</style></head><body>
<nav id="nav"></nav><main id="app"></main><div id="modal" hidden></div>
<script>
let tab='dash',cart=[],cust='';
const $=s=>document.querySelector(s),td=()=>new Date().toISOString().slice(0,10),ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
const uid=()=>Math.random().toString(36).slice(2,8),fm=n=>'KSh '+Math.round(n).toLocaleString('en-KE'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function seed(){const it=[['Cement 50kg','bags',780,640,40],['Roofing sheet 3m','pcs',1150,930,30],['Nails 3 inch','kg',210,150,25],['Paint 4L','tins',1450,1100,12],['PVC pipe 4"','pcs',950,720,15],['Padlock','pcs',420,280,10],['Steel bar Y12','pcs',1300,1080,30],['Wheelbarrow','pcs',4800,3800,4]].map(x=>({id:uid(),name:x[0],unit:x[1],price:x[2],cost:x[3],min:x[4]}));
const su=[['Bamburi Distributors','0711 000 111'],['Mabati Depot','0722 000 222'],['Nairobi Tools & Paints','0733 000 333']].map(x=>({id:uid(),name:x[0],phone:x[1]}));
const si=[],sl=[];[[0,0,200],[1,1,150],[2,2,100],[0,3,40],[0,4,60],[2,5,40],[1,6,120],[0,7,10]].forEach((r,i)=>si.push({id:uid(),date:ago(20-i),sup:su[r[0]].id,item:it[r[1]].id,qty:r[2],cost:it[r[1]].cost}));
[[0,0,30,'Juma Builders'],[1,1,20,'Walk-in'],[2,2,15,'Walk-in'],[3,3,6,'Kamau Contractors'],[4,0,45,'Kamau Contractors'],[5,6,40,'Ndegwa Ltd'],[6,4,10,'Walk-in'],[6,7,2,'Walk-in']].forEach(r=>{const i=it[r[1]];sl.push({id:uid(),date:ago(r[0]),cust:r[3],lines:[{item:i.id,qty:r[2],price:i.price}],pays:r[3]=='Kamau Contractors'?[{id:uid(),date:ago(r[0]),amt:i.price*r[2]*.5,m:'M-Pesa'}]:[{id:uid(),date:ago(r[0]),amt:i.price*r[2],m:'Cash'}]})});
return{items:it,sup:su,stockIn:si,sales:sl,supPays:[{id:uid(),date:ago(10),sup:su[0].id,amt:100000,ref:'Bank transfer'},{id:uid(),date:ago(8),sup:su[1].id,amt:90000,ref:'Cheque 0123'}],
exp:[{id:uid(),date:ago(12),cat:'Rent',desc:'Shop rent',amt:25000},{id:uid(),date:ago(6),cat:'Electricity',desc:'KPLC tokens',amt:4200},{id:uid(),date:ago(3),cat:'Transport',desc:'Delivery pickup fuel',amt:3500}],
inc:[{id:uid(),date:ago(5),desc:'Lorry hire',amt:6000}],
wk:[['Peter Otieno','Shop manager',35000],['Mary Wanjiku','Cashier',22000],['Hassan Ali','Storekeeper',20000],['Joseph Kiptoo','Loader / delivery',15000]].map(x=>({id:uid(),name:x[0],role:x[1],salary:x[2],phone:'07xx xxx xxx',att:{}})),
tasks:[]}}
const COLS={items:'Stock item',sup:'Supplier',stockIn:'Stock received',sales:'Sale',supPays:'Supplier payment',exp:'Expense',inc:'Other income',wk:'Worker',tasks:'Task'};
let S={},DB=null,U=null,USERS=[],AUD=[],snap={},state='loading',pend=0,af='',CAN_SETUP=false;
Object.keys(COLS).forEach(c=>{S[c]=[];snap[c]={}});
const RL={admin:'Administrator',manager:'Manager',cashier:'Cashier',storekeeper:'Storekeeper',accountant:'Accountant'},RO=Object.entries(RL);
const ALL=['dash','inv.view','inv.edit','sup.view','sup.edit','sales.view','sales.edit','acc.view','acc.edit','staff.view','staff.edit','audit','users'];
const ROLES={admin:ALL,manager:ALL.filter(p=>p!='users'),cashier:['inv.view','sales.view','sales.edit'],storekeeper:['inv.view','inv.edit','sup.view','sup.edit'],accountant:['dash','sup.view','sales.view','acc.view','acc.edit']};
const NEED={dash:'dash',inv:'inv.view',sup:'sup.view',sales:'sales.view',acc:'acc.view',staff:'staff.view',audit:'audit',users:'users'};
const can=p=>!!U&&(ROLES[U.role]||[]).includes(p);
const FP={addItem:'inv.edit',recv:'inv.edit',addSup:'sup.edit',paySup:'acc.edit',addExp:'acc.edit',addInc:'acc.edit',addWk:'staff.edit',addTask:'staff.edit',mark:'staff.edit',done:'staff.edit',paySal:'staff.edit',payCust:'sales.edit',newSale:'sales.edit'};
Object.keys(FP).forEach(n=>{const f=window[n];window[n]=(...a)=>can(FP[n])?f(...a):alert('Your role does not allow this action.')});
const clone=o=>JSON.parse(JSON.stringify(o)),by=r=>`<td>${esc((r.by||'').split('@')[0])}</td>`;
const pwh=async(p,s)=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const dsc=(c,r)=>({items:r.name,sup:r.name,wk:r.name+' (today: '+((r.att||{})[td()]||'-')+')',tasks:r.text+(r.done?' [done]':''),stockIn:r.qty+' × '+I(r.item).name+' from '+SU(r.sup),sales:'INV-'+String(r.no||0).padStart(4,'0')+' '+r.cust+', total '+fm(r.lines?sTot(r):0)+', paid '+fm(r.pays?sPaid(r):0),supPays:SU(r.sup)+' '+fm(r.amt),exp:r.cat+': '+r.desc+' '+fm(r.amt),inc:r.desc+' '+fm(r.amt)}[c]);
function log(a,c,d,who){if(!DB||(!U&&!who))return;const t=new Date().toISOString();DB.doc('audit/'+t.replace(/[:.]/g,'-')+uid()).set({t,u:who||U.email,n:U?U.name:'',role:U?U.role:'',a,c,d:d||''}).catch(()=>{})}
function save(){if(!DB||!U)return;for(const c in COLS)for(const r of S[c]){let js=JSON.stringify(r),old=snap[c][r.id];if(old===js)continue;if(old){r.ed=U.email;r.edAt=new Date().toISOString()}else{r.by=U.email;r.at=new Date().toISOString()}js=JSON.stringify(r);snap[c][r.id]=js;DB.doc(c+'/'+r.id).set(JSON.parse(js)).catch(e=>alert('Could not save: '+(e.message||e.code||'database error')));log(old?'Changed':'Added',COLS[c],dsc(c,r))}}
const tick=()=>{if(!$('#modal').hidden){pend=1;return}if(!U&&document.activeElement&&/INPUT/.test(document.activeElement.tagName))return;render()};
async function boot(){const d=await claude.use('db'),us=await claude.use('user');if(!d){state='nodb';return render()}DB=d;CAN_SETUP=!!(us&&us.canEdit());const need=Object.keys(COLS).length+2,seen={};let tm;const got=k=>{seen[k]=1;if(state!='ok'&&Object.keys(seen).length==need){clearTimeout(tm);state='ok'}},bad=()=>{if(state!='ok'){state='slow';render()}};tm=setTimeout(()=>{if(state=='loading'){state='slow';render()}},10000);
DB.collection('users').onSnapshot(s=>{USERS=s.docs.map(x=>clone(x.data()));let id=U?U.id:null;if(!id)try{id=sessionStorage.getItem('shab_u')}catch(e){}U=USERS.find(x=>x.id==id&&x.active!==false)||null;got('users');tick()},bad);
Object.keys(COLS).forEach(c=>DB.collection(c).onSnapshot(s=>{S[c]=s.docs.map(x=>clone(x.data())).sort((a,b)=>(a.at||'').localeCompare(b.at||'')||String(a.id).localeCompare(String(b.id)));snap[c]={};S[c].forEach(r=>snap[c][r.id]=JSON.stringify(r));got(c);tick()},bad));
DB.collection('audit').orderBy('t','desc').limit(300).onSnapshot(s=>{AUD=s.docs.map(x=>x.data());got('audit');if(tab=='audit')tick()},bad)}
function gate(){const w=h=>`<div class="lg card"><h2 style="margin-bottom:10px">Shabiki<span style="color:var(--ac)">Hardware</span></h2>${h}</div>`,f=(i,l,t)=>`<label>${l}<input id="${i}" type="${t||'text'}" autocomplete="${t=='password'?'current-password':'username'}"></label>`;
if(state=='nodb')return w('<p>Open this page in claude.ai while signed in to use the shared database.</p>');
if(state!='ok')return w(state=='slow'?'<p>Cannot reach the database yet. Check your internet connection; this page keeps trying.</p>':'<p>Loading…</p>');
if(!USERS.length)return w(CAN_SETUP?`<p>Create the first account. It becomes the Administrator.</p>${f('sn','Full name')}${f('se','Email (your username)','email')}${f('sp','Password (8+ characters)','password')}<div class="err" id="lerr"></div><button class="b1" onclick="doSetup()">Create administrator</button>`:'<p>No accounts exist yet. The page owner must open this page first and create the Administrator account.</p>');
return w(`<p class="mu">Sign in with your work email and password.</p><label>Email<input id="le" type="email" autocomplete="username"></label><label>Password<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"></label><div class="err" id="lerr"></div><button class="b1" onclick="doLogin()">Sign in</button>`)}
async function doLogin(){const e=$('#le').value.trim().toLowerCase(),p=$('#lp').value,u=USERS.find(x=>x.email==e);if(!u||u.active===false||await pwh(p,u.salt)!==u.hash){$('#lerr').textContent='Wrong email or password, or the account is switched off.';log('Failed sign-in','Session',e,e||'unknown');return}U=u;try{sessionStorage.setItem('shab_u',u.id)}catch(x){}log('Signed in','Session','');render()}
async function doSetup(){const n=$('#sn').value.trim(),e=$('#se').value.trim().toLowerCase(),p=$('#sp').value;if(!n||!e.includes('@')||p.length<8){$('#lerr').textContent='Enter your name, a valid email and a password of 8+ characters.';return}const salt=uid()+uid(),u={id:uid(),name:n,email:e,role:'admin',active:true,salt,hash:await pwh(p,salt),at:new Date().toISOString()};try{await DB.doc('users/'+u.id).set(u)}catch(x){$('#lerr').textContent='Could not save: '+(x.message||x.code);return}U=u;try{sessionStorage.setItem('shab_u',u.id)}catch(x){}log('Created administrator','User',e);render()}
function out(){log('Signed out','Session','');U=null;try{sessionStorage.removeItem('shab_u')}catch(e){}render()}
const uget=id=>USERS.find(x=>x.id==id),uset=u=>DB.doc('users/'+u.id).set(u);
function addUser(){form('Add user',[{k:'name',l:'Full name'},{k:'email',l:'Email (username)',t:'email'},{k:'role',l:'Role',o:RO},{k:'pw',l:'Temporary password (8+ chars)'}],async v=>{v.email=v.email.trim().toLowerCase();if(USERS.some(u=>u.email==v.email)||v.pw.length<8){alert('Not saved: use a new email and a password of 8+ characters.');return}const salt=uid()+uid();await uset({id:uid(),name:v.name,email:v.email,role:v.role,active:true,salt,hash:await pwh(v.pw,salt),by:U.email,at:new Date().toISOString()});log('Added user','User',v.email+' as '+RL[v.role])})}
function resetPw(id){const u=uget(id);form('New password for '+esc(u.email),[{k:'pw',l:'New password (8+ chars)'}],async v=>{if(v.pw.length<8)return alert('Not saved: password needs 8+ characters.');const salt=uid()+uid();await uset({...u,salt,hash:await pwh(v.pw,salt)});log('Reset password','User',u.email)})}
function setRole(id){const u=uget(id);if(u.id==U.id)return alert('You cannot change your own role.');form('Change role for '+esc(u.email),[{k:'role',l:'New role',o:RO}],async v=>{await uset({...u,role:v.role});log('Changed role','User',u.email+' to '+RL[v.role])})}
function toggleU(id){const u=uget(id);if(u.id==U.id)return alert('You cannot switch off your own account.');uset({...u,active:u.active===false});log(u.active===false?'Switched on user':'Switched off user','User',u.email)}
function users(){return`<div class="top"><h2>Users &amp; roles</h2><button class="b1" onclick="addUser()">Add user</button></div><div class="card rl"><h3>What each role can do</h3><p><b>Administrator:</b> everything, including users and the activity log.</p><p><b>Manager:</b> all business areas and the activity log.</p><p><b>Cashier:</b> make sales, receive customer payments, print invoices and receipts, view stock.</p><p><b>Storekeeper:</b> add items, receive stock, add suppliers, view stock and suppliers.</p><p><b>Accountant:</b> view dashboard, sales and suppliers; record supplier payments, expenses and income.</p></div><div class="card">${tbl(['Name','Email','Role','Status',''],USERS.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${RL[u.role]||'?'}</td><td>${u.active===false?tag('Off','bad'):tag('Active','ok')}</td><td><button class="sm" onclick="setRole('${u.id}')">Change role</button><button class="sm" onclick="resetPw('${u.id}')">Reset password</button><button class="sm" onclick="toggleU('${u.id}')">${u.active===false?'Switch on':'Switch off'}</button></td></tr>`))}</div>`}
function audit(){const us=[...new Set(AUD.map(a=>a.u))],rows=AUD.filter(a=>!af||a.u==af);return`<div class="top"><h2>Activity log</h2><select style="width:auto" onchange="af=this.value;render()"><option value="">All users</option>${us.map(u=>`<option ${u==af?'selected':''}>${esc(u)}</option>`).join('')}</select></div><div class="card"><p class="mu" style="margin:0 0 8px">The latest 300 actions: who did what, and when.</p>${tbl(['When','User','Role','Action','Area','Details'],rows.map(a=>`<tr><td>${new Date(a.t).toLocaleString('en-KE')}</td><td>${esc(a.n)} ${esc(a.u)}</td><td>${esc(RL[a.role]||'')}</td><td>${esc(a.a)}</td><td>${esc(a.c)}</td><td style="white-space:normal">${esc(a.d)}</td></tr>`))}</div>`}

const I=id=>S.items.find(x=>x.id==id)||{name:'?',unit:''},SU=id=>(S.sup.find(x=>x.id==id)||{name:'?'}).name;
const inQ=id=>S.stockIn.filter(x=>x.item==id).reduce((a,x)=>a+x.qty,0),outQ=id=>S.sales.reduce((a,s)=>a+s.lines.filter(l=>l.item==id).reduce((b,l)=>b+l.qty,0),0),stk=id=>inQ(id)-outQ(id);
const sTot=s=>s.lines.reduce((a,l)=>a+l.qty*l.price,0),sPaid=s=>s.pays.reduce((a,p)=>a+p.amt,0),sum=(a,k)=>a.reduce((t,x)=>t+x[k],0);
const billed=id=>S.stockIn.filter(x=>x.sup==id).reduce((a,x)=>a+x.qty*x.cost,0),paidSup=id=>S.supPays.filter(x=>x.sup==id).reduce((a,x)=>a+x.amt,0);
const moneyIn=()=>S.sales.reduce((a,s)=>a+sPaid(s),0)+sum(S.inc,'amt'),moneyOut=()=>sum(S.supPays,'amt')+sum(S.exp,'amt');
const opt=(a,v='id',l='name')=>a.map(x=>[x[v],x[l]]);
function closeM(){$('#modal').hidden=true;if(pend){pend=0;render()}}
function form(title,fields,ok){const m=$('#modal');m.innerHTML=`<div class="box"><h3>${title}</h3><div class="fg">${fields.map(x=>`<label>${x.l}${x.o?`<select id="f_${x.k}">${x.o.map(o=>`<option value="${o[0]}">${esc(o[1])}</option>`).join('')}</select>`:`<input id="f_${x.k}" type="${x.t||'text'}" value="${esc(x.v??'')}">`}</label>`).join('')}</div><div class="row"><button class="b2" onclick="closeM()">Cancel</button><button class="b1" id="fok">Save</button></div></div>`;m.hidden=false;
$('#fok').onclick=()=>{const v={};for(const x of fields){let e=$('#f_'+x.k).value;if(x.t=='number'){e=+e;if(!(e>0)&&!x.z){alert(x.l+' must be more than 0');return}}else if(!e&&!x.opt){alert('Please fill in '+x.l);return}v[x.k]=e}ok(v);closeM();save();render()}}
const D={k:'date',l:'Date',t:'date',v:td()};
function addItem(){form('Add stock item',[{k:'name',l:'Item name'},{k:'unit',l:'Unit (bags, pcs, kg)'},{k:'cost',l:'Buying price',t:'number'},{k:'price',l:'Selling price',t:'number'},{k:'min',l:'Reorder level',t:'number'}],v=>S.items.push({id:uid(),...v}))}
function recv(){if(!S.sup.length||!S.items.length)return alert('Add a supplier and an item first');form('Receive stock from supplier',[D,{k:'sup',l:'Supplier',o:opt(S.sup)},{k:'item',l:'Item',o:opt(S.items)},{k:'qty',l:'Quantity received',t:'number'},{k:'cost',l:'Cost per unit',t:'number'}],v=>S.stockIn.push({id:uid(),...v}))}
function addSup(){form('Add supplier',[{k:'name',l:'Supplier name'},{k:'phone',l:'Phone'}],v=>S.sup.push({id:uid(),...v}))}
function paySup(id){form('Pay '+esc(SU(id)),[D,{k:'amt',l:'Amount paid',t:'number'},{k:'ref',l:'Method / reference'}],v=>S.supPays.push({id:uid(),sup:id,...v}))}
function addExp(){form('Record expense',[D,{k:'cat',l:'Category',o:['Rent','Electricity','Transport','Salaries','Licences','Repairs','Other'].map(x=>[x,x])},{k:'desc',l:'Description'},{k:'amt',l:'Amount',t:'number'}],v=>S.exp.push({id:uid(),...v}))}
function addInc(){form('Record other income',[D,{k:'desc',l:'Source (e.g. lorry hire)'},{k:'amt',l:'Amount',t:'number'}],v=>S.inc.push({id:uid(),...v}))}
function addWk(){form('Add worker',[{k:'name',l:'Full name'},{k:'role',l:'Role'},{k:'phone',l:'Phone'},{k:'salary',l:'Monthly salary',t:'number'}],v=>S.wk.push({id:uid(),att:{},...v}))}
function addTask(){form('Assign task',[{k:'w',l:'Worker',o:opt(S.wk)},{k:'text',l:'Task'},{k:'due',l:'Due date',t:'date',v:td()}],v=>S.tasks.push({id:uid(),done:false,...v}))}
function mark(w,s){const x=S.wk.find(a=>a.id==w);x.att[td()]=s;save();render()}
function done(id){const t=S.tasks.find(x=>x.id==id);t.done=!t.done;save();render()}
function paySal(id){const w=S.wk.find(x=>x.id==id),mo=td().slice(0,7);if(S.exp.some(e=>e.wid==id&&e.date.slice(0,7)==mo)&&!confirm('Salary for this month is already paid. Pay again?'))return;S.exp.push({id:uid(),date:td(),cat:'Salaries',desc:'Salary: '+w.name,amt:w.salary,wid:id});save();render()}
function payCust(id){const s=S.sales.find(x=>x.id==id),b=sTot(s)-sPaid(s);form('Receive payment',[D,{k:'amt',l:'Amount (balance '+fm(b)+')',t:'number',v:b},{k:'m',l:'Method',o:[['Cash','Cash'],['M-Pesa','M-Pesa'],['Bank','Bank']]}],v=>{if(v.amt>b)v.amt=b;const p={id:uid(),...v};s.pays.push(p);setTimeout(()=>doc(id,p.id),0)})}
function newSale(){cart=[];cust='';saleM()}
function saleM(){const m=$('#modal'),tot=cart.reduce((a,l)=>a+l.qty*l.price,0);m.innerHTML=`<div class="box"><h3>New sale</h3><div class="fg"><label>Customer<input id="sc" value="${esc(cust)}" placeholder="Walk-in"></label><label>Payment now<input id="sp" type="number" min="0" placeholder="0"></label>
<label>Item<select id="si" onchange="$('#spr').value=I(this.value).price">${S.items.map(i=>`<option value="${i.id}">${esc(i.name)} (${stk(i.id)} ${esc(i.unit)})</option>`).join('')}</select></label><label>Method<select id="sm"><option>Cash</option><option>M-Pesa</option><option>Bank</option></select></label>
<label>Quantity<input id="sq" type="number" min="1" value="1"></label><label>Unit price<input id="spr" type="number" value="${S.items[0]?S.items[0].price:0}"></label></div>
<div class="row" style="margin-bottom:10px"><button class="b2" onclick="addLine()">Add item to sale</button></div>
<table>${cart.map((l,i)=>`<tr><td>${esc(I(l.item).name)}</td><td>${l.qty} × ${fm(l.price)}</td><td class="n">${fm(l.qty*l.price)}</td><td><button class="sm" onclick="cart.splice(${i},1);saleM()">Remove</button></td></tr>`).join('')||'<tr><td class="mu">No items yet. Pick an item and add it.</td></tr>'}</table>
<p><b>Total: ${fm(tot)}</b></p><div class="row"><button class="b2" onclick="closeM()">Cancel</button><button class="b1" onclick="saveSale()">Save sale &amp; invoice</button></div></div>`;m.hidden=false;if($('#si')&&cart.length==0)$('#spr').value=I($('#si').value).price}
function addLine(){cust=$('#sc').value;const item=$('#si').value,qty=+$('#sq').value,price=+$('#spr').value,have=stk(item)-cart.filter(l=>l.item==item).reduce((a,l)=>a+l.qty,0);if(!(qty>0))return alert('Enter a quantity');if(qty>have)return alert('Only '+have+' '+I(item).unit+' in stock');cart.push({item,qty,price});saleM()}
function saveSale(){if(!cart.length)return alert('Add at least one item');const c=$('#sc').value||'Walk-in',p=+$('#sp').value||0,tot=cart.reduce((a,l)=>a+l.qty*l.price,0),s={id:uid(),no:Math.max(0,...S.sales.map(x=>x.no||0))+1,date:td(),cust:c,lines:cart,pays:[]};if(p>0)s.pays.push({id:uid(),date:td(),amt:Math.min(p,tot),m:$('#sm').value});S.sales.push(s);save();render();doc(s.id)}
function doc(sid,pid){const s=S.sales.find(x=>x.id==sid),n=s.no||S.sales.indexOf(s)+1,p=pid&&s.pays.find(x=>x.id==pid),tot=sTot(s),paid=sPaid(s);let h=`<div class="doc"><div style="display:flex;justify-content:space-between;flex-wrap:wrap"><div><h3>ShabikiHardware</h3><div>Building &amp; hardware supplies</div></div><div style="text-align:right"><h3>${p?'RECEIPT':'INVOICE'}</h3>${p?'REC-':'INV-'}${String(n).padStart(4,'0')}${p?'-'+(s.pays.indexOf(p)+1):''}<br>${p?p.date:s.date}</div></div><p><b>Customer:</b> ${esc(s.cust)}</p>`;
if(!p)h+=`<div class="tw"><table><tr><th>Item</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Amount</th></tr>${s.lines.map(l=>`<tr><td>${esc(I(l.item).name)}</td><td class="n">${l.qty} ${esc(I(l.item).unit)}</td><td class="n">${fm(l.price)}</td><td class="n">${fm(l.qty*l.price)}</td></tr>`).join('')}</table></div><p style="text-align:right">Total: <b>${fm(tot)}</b><br>Paid: ${fm(paid)}<br>Balance due: <b>${fm(tot-paid)}</b></p>`;
else{const upto=s.pays.slice(0,s.pays.indexOf(p)+1).reduce((a,x)=>a+x.amt,0);h+=`<p>Received <b>${fm(p.amt)}</b> by ${esc(p.m)} for invoice INV-${String(n).padStart(4,'0')} (total ${fm(tot)}).</p><p>Balance after this payment: <b>${fm(tot-upto)}</b></p><p>Items: ${s.lines.map(l=>esc(I(l.item).name)+' ×'+l.qty).join(', ')}</p>`}
h+=`<p style="text-align:center;margin-top:20px">Thank you for shopping at ShabikiHardware.</p></div><div class="row"><button class="b2" onclick="closeM()">Close</button><button class="b1" onclick="print()">Print</button></div>`;$('#modal').innerHTML=`<div class="box" style="max-width:700px">${h}</div>`;$('#modal').hidden=false}
const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th${x[0]=='#'?' class="n"':''}>${x.replace(/^#/,'')}</th>`).join('')}</tr>${r.join('')||'<tr><td class="mu">Nothing recorded yet.</td></tr>'}</table></div>`;
const tag=(t,c)=>`<span class="tag t-${c}">${t}</span>`;
function dash(){const t=td(),mo=t.slice(0,7),sv=S.items.reduce((a,i)=>a+stk(i.id)*i.cost,0),sd=d=>S.sales.filter(s=>s.date==d).reduce((a,s)=>a+sTot(s),0),sm=S.sales.filter(s=>s.date.slice(0,7)==mo).reduce((a,s)=>a+sTot(s),0),
cogs=S.sales.reduce((a,s)=>a+s.lines.reduce((b,l)=>b+l.qty*(S.items.find(i=>i.id==l.item)||{cost:0}).cost,0),0),rev=S.sales.reduce((a,s)=>a+sTot(s),0),rec=S.sales.reduce((a,s)=>a+sTot(s)-sPaid(s),0),pay=S.sup.reduce((a,s)=>a+billed(s.id)-paidSup(s.id),0),low=S.items.filter(i=>stk(i.id)<=i.min),mx=Math.max(1,...S.items.map(i=>Math.max(inQ(i.id),outQ(i.id)))),
days=[6,5,4,3,2,1,0].map(n=>[ago(n),sd(ago(n))]),dm=Math.max(1,...days.map(d=>d[1])),ex=S.exp.reduce((a,e)=>(a[e.cat]=(a[e.cat]||0)+e.amt,a),{}),top=S.items.map(i=>[i.name,S.sales.reduce((a,s)=>a+s.lines.filter(l=>l.item==i.id).reduce((b,l)=>b+l.qty*l.price,0),0)]).sort((a,b)=>b[1]-a[1]).slice(0,5);
return`<div class="top"><h2>Dashboard</h2></div><div class="kp"><div class="k g"><span>Sales today</span><b>${fm(sd(t))}</b></div><div class="k g"><span>Sales this month</span><b>${fm(sm)}</b></div><div class="k y"><span>Stock value (at cost)</span><b>${fm(sv)}</b></div><div class="k b"><span>Gross profit on sales</span><b>${fm(rev-cogs)}</b></div><div class="k"><span>Net cash (in − out)</span><b class="${moneyIn()>=moneyOut()?'pos':'neg'}">${fm(moneyIn()-moneyOut())}</b></div><div class="k r"><span>Owed by customers</span><b>${fm(rec)}</b></div><div class="k r"><span>Owed to suppliers</span><b>${fm(pay)}</b></div><div class="k ${low.length?'r':'g'}"><span>Items to reorder</span><b>${low.length}</b></div></div>
<div class="card"><h3>Stock in vs stock out, by item</h3>${S.items.map(i=>`<div style="margin:8px 0"><b>${esc(i.name)}</b> <span class="mu">— ${stk(i.id)} ${esc(i.unit)} left</span><div class="bar"><i style="width:${inQ(i.id)/mx*60}%;background:var(--bl)"></i><em>${inQ(i.id)} in</em></div><div class="bar"><i style="width:${outQ(i.id)/mx*60}%;background:var(--ac)"></i><em>${outQ(i.id)} out</em></div></div>`).join('')}</div>
<div class="g2"><div class="card"><h3>Sales, last 7 days</h3><div class="cols">${days.map(d=>`<div><i style="height:${d[1]/dm*100}%"></i>${d[0].slice(5)}</div>`).join('')}</div></div><div class="card"><h3>Best sellers (revenue)</h3>${top.map(x=>`<div class="bar"><i style="width:${x[1]/Math.max(1,top[0][1])*55}%;background:var(--ok)"></i><span>${esc(x[0])}</span><em>${fm(x[1])}</em></div>`).join('')}</div>
<div class="card"><h3>Expenses by category</h3>${Object.entries(ex).map(([k,v])=>`<div class="bar"><i style="width:${v/Math.max(...Object.values(ex))*55}%;background:var(--bad)"></i><span>${k}</span><em>${fm(v)}</em></div>`).join('')||'<span class="mu">No expenses yet.</span>'}</div>
<div class="card"><h3>Reorder alerts</h3>${low.map(i=>`<div>${tag('Low','bad')} ${esc(i.name)}: ${stk(i.id)} ${esc(i.unit)} left (reorder at ${i.min})</div>`).join('')||'<span class="mu">All items are above their reorder level.</span>'}</div></div>`}
function inv(){return`<div class="top"><h2>Stock &amp; inventory</h2><div><button class="b2" onclick="addItem()">Add item</button> <button class="b1" onclick="recv()">Receive stock</button></div></div><div class="card"><h3>Current stock</h3>${tbl(['Item','Unit','#In','#Out','#In stock','#Cost','#Price','#Value','Status'],S.items.map(i=>{const s=stk(i.id);return`<tr><td>${esc(i.name)}</td><td>${esc(i.unit)}</td><td class="n">${inQ(i.id)}</td><td class="n">${outQ(i.id)}</td><td class="n"><b>${s}</b></td><td class="n">${fm(i.cost)}</td><td class="n">${fm(i.price)}</td><td class="n">${fm(s*i.cost)}</td><td>${s<=0?tag('Out','bad'):s<=i.min?tag('Low','w'):tag('OK','ok')}</td></tr>`}))}</div>
<div class="card"><h3>Stock received from suppliers</h3>${tbl(['Date','Supplier','Item','#Qty','#Unit cost','#Total','Received by'],[...S.stockIn].reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(SU(x.sup))}</td><td>${esc(I(x.item).name)}</td><td class="n">${x.qty}</td><td class="n">${fm(x.cost)}</td><td class="n">${fm(x.qty*x.cost)}</td>${by(x)}</tr>`))}</div>`}
function sup(){return`<div class="top"><h2>Suppliers</h2><div><button class="b2" onclick="addSup()">Add supplier</button> <button class="b1" onclick="recv()">Receive stock</button></div></div><div class="card">${tbl(['Supplier','Phone','#Stock received','#Paid','#Balance owed',''],S.sup.map(s=>{const b=billed(s.id),p=paidSup(s.id);return`<tr><td>${esc(s.name)}</td><td>${esc(s.phone)}</td><td class="n">${fm(b)}</td><td class="n">${fm(p)}</td><td class="n ${b>p?'neg':''}">${fm(b-p)}</td><td><button class="sm" onclick="paySup('${s.id}')">Record payment</button></td></tr>`}))}</div>`}
function sales(){return`<div class="top"><h2>Sales</h2><button class="b1" onclick="newSale()">New sale</button></div><div class="card">${tbl(['No.','Date','Customer','Items','#Total','#Paid','#Balance','Sold by','Documents'],S.sales.map((s,i)=>[s,i]).reverse().map(([s,i])=>{const b=sTot(s)-sPaid(s);return`<tr><td>INV-${String(s.no||i+1).padStart(4,'0')}</td><td>${s.date}</td><td>${esc(s.cust)}</td><td>${s.lines.map(l=>esc(I(l.item).name)+' ×'+l.qty).join(', ')}</td><td class="n">${fm(sTot(s))}</td><td class="n">${fm(sPaid(s))}</td><td class="n ${b?'neg':''}">${fm(b)}</td>${by(s)}<td><button class="sm" onclick="doc('${s.id}')">Invoice</button>${s.pays.map((p,j)=>`<button class="sm" onclick="doc('${s.id}','${p.id}')">Receipt ${j+1}</button>`).join('')}${b?`<button class="sm" onclick="payCust('${s.id}')">Receive payment</button>`:''}</td></tr>`}))}</div>`}
function acc(){const ins=[...S.sales.flatMap(s=>s.pays.map(p=>({date:p.date,w:'Sale: '+s.cust,amt:p.amt,i:1}))),...S.inc.map(x=>({date:x.date,w:'Income: '+x.desc,amt:x.amt,i:1})),...S.supPays.map(x=>({date:x.date,w:'Supplier: '+SU(x.sup),amt:x.amt,i:0})),...S.exp.map(x=>({date:x.date,w:x.cat+': '+x.desc,amt:x.amt,i:0}))].sort((a,b)=>b.date.localeCompare(a.date)),
salesIn=S.sales.reduce((a,s)=>a+sPaid(s),0);
return`<div class="top"><h2>Accounts</h2><div><button class="b2" onclick="addInc()">Other income</button> <button class="b2" onclick="addExp()">Expense</button> <button class="b1" onclick="${S.sup.length?`paySup(S.sup[0].id)`:'addSup()'}">Pay supplier</button></div></div>
<div class="kp"><div class="k g"><span>From stock sales</span><b>${fm(salesIn)}</b></div><div class="k g"><span>Other income</span><b>${fm(sum(S.inc,'amt'))}</b></div><div class="k r"><span>Paid to suppliers</span><b>${fm(sum(S.supPays,'amt'))}</b></div><div class="k r"><span>Other expenses</span><b>${fm(sum(S.exp,'amt'))}</b></div><div class="k y"><span>Net cash position</span><b class="${moneyIn()>=moneyOut()?'pos':'neg'}">${fm(moneyIn()-moneyOut())}</b></div></div>
<div class="g2"><div class="card"><h3>Payments to suppliers</h3>${tbl(['Date','Supplier','#Amount','Reference','Paid by'],[...S.supPays].reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(SU(x.sup))}</td><td class="n">${fm(x.amt)}</td><td>${esc(x.ref)}</td>${by(x)}</tr>`))}</div><div class="card"><h3>Other expenses</h3>${tbl(['Date','Category','Details','#Amount','Recorded by'],[...S.exp].reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(x.cat)}</td><td>${esc(x.desc)}</td><td class="n">${fm(x.amt)}</td>${by(x)}</tr>`))}</div></div>
<div class="card" style="margin-top:16px"><h3>Money received</h3>${tbl(['Date','Source','#Amount'],[...S.sales.flatMap(s=>s.pays.map(p=>({d:p.date,w:'Sale to '+s.cust+' ('+p.m+')',a:p.amt}))),...S.inc.map(x=>({d:x.date,w:x.desc,a:x.amt}))].sort((a,b)=>b.d.localeCompare(a.d)).map(x=>`<tr><td>${x.d}</td><td>${esc(x.w)}</td><td class="n">${fm(x.a)}</td></tr>`))}</div>
<div class="card"><h3>Full ledger</h3>${tbl(['Date','Details','#Money in','#Money out'],ins.map(x=>`<tr><td>${x.date}</td><td>${esc(x.w)}</td><td class="n pos">${x.i?fm(x.amt):''}</td><td class="n neg">${x.i?'':fm(x.amt)}</td></tr>`))}</div>`}
function staff(){const t=td(),mo=t.slice(0,7),cnt=(w,c)=>Object.entries(w.att).filter(([d,v])=>d.slice(0,7)==mo&&v==c).length,paid=w=>S.exp.some(e=>e.wid==w.id&&e.date.slice(0,7)==mo);
return`<div class="top"><h2>Workers</h2><div><button class="b2" onclick="addTask()">Assign task</button> <button class="b1" onclick="addWk()">Add worker</button></div></div><div class="kp"><div class="k b"><span>Workers</span><b>${S.wk.length}</b></div><div class="k g"><span>Present today</span><b>${S.wk.filter(w=>w.att[t]=='P').length}</b></div><div class="k y"><span>Monthly payroll</span><b>${fm(sum(S.wk,'salary'))}</b></div><div class="k r"><span>Open tasks</span><b>${S.tasks.filter(x=>!x.done).length}</b></div></div>
<div class="card"><h3>Attendance &amp; payroll (today ${t})</h3>${tbl(['Name','Role','Today','#Present','#Absent','#Leave','#Salary','Salary this month'],S.wk.map(w=>`<tr><td>${esc(w.name)}</td><td>${esc(w.role)}</td><td>${['P','A','L'].map(c=>`<button class="sm" style="${w.att[t]==c?'background:var(--ac);color:#1b2830':''}" onclick="mark('${w.id}','${c}')">${{P:'Present',A:'Absent',L:'Leave'}[c]}</button>`).join('')}</td><td class="n">${cnt(w,'P')}</td><td class="n">${cnt(w,'A')}</td><td class="n">${cnt(w,'L')}</td><td class="n">${fm(w.salary)}</td><td>${paid(w)?tag('Paid','ok'):`<button class="sm" onclick="paySal('${w.id}')">Pay salary</button>`}</td></tr>`))}</div>
<div class="card"><h3>Tasks</h3>${tbl(['Worker','Task','Due','Status',''],S.tasks.map(x=>`<tr><td>${esc((S.wk.find(w=>w.id==x.w)||{name:'?'}).name)}</td><td>${esc(x.text)}</td><td>${x.due}</td><td>${x.done?tag('Done','ok'):x.due<t?tag('Overdue','bad'):tag('Open','w')}</td><td><button class="sm" onclick="done('${x.id}')">${x.done?'Reopen':'Mark done'}</button></td></tr>`))}</div>`}
const T=[['dash','Dashboard',dash],['inv','Stock',inv],['sup','Suppliers',sup],['sales','Sales',sales],['acc','Accounts',acc],['staff','Workers',staff],['audit','Activity log',audit],['users','Users',users]];
function render(){if(state!='ok'||!USERS.length||!U){$('#nav').style.display='none';$('#app').innerHTML=gate();return}$('#nav').style.display='';if(!can(NEED[tab]))tab=(T.find(t=>can(NEED[t[0]]))||['dash'])[0];render0();$('#nav').insertAdjacentHTML('beforeend',`<div class="me"><b>${esc(U.name)}</b>${RL[U.role]||''}<br><button onclick="out()">Sign out</button></div>`);document.querySelectorAll('#app button[onclick]').forEach(b=>{const m=b.getAttribute('onclick').match(/^(\w+)\(/);if(m&&FP[m[1]]&&!can(FP[m[1]]))b.remove()})}

render();boot();
</script></body></html>
